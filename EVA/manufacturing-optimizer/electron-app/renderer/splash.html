<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузка</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(145deg, #0f172a 0%, #1e3a5f 50%, #0c4a6e 100%);
      color: #fff; font-family: system-ui, sans-serif; overflow: hidden;
    }
    .logos { display: flex; gap: 48px; align-items: center; margin-bottom: 40px; }
    .logo-box {
      width: 120px; height: 120px; border-radius: 24px;
      background: rgba(255,255,255,0.08); display: flex; align-items: center;
      justify-content: center; font-size: 28px; font-weight: 700;
      animation: pulse 2s ease-in-out infinite;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .logo-box.tmh { animation-delay: 0s; }
    .logo-box.nevz { animation-delay: 0.3s; }
    .brand { font-size: 22px; letter-spacing: 0.08em; opacity: 0.95; margin-bottom: 8px; }
    .sub { font-size: 13px; opacity: 0.6; margin-bottom: 32px; }
    .bar {
      width: min(320px, 70vw); height: 4px; background: rgba(255,255,255,0.15);
      border-radius: 4px; overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      animation: load 2.4s ease-in-out forwards;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56,189,248,0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 40px 8px rgba(56,189,248,0.15); }
    }
    @keyframes load {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="logos">
    <div class="logo-box tmh">ТМХ</div>
    <div class="logo-box nevz">НЭВЗ</div>
  </div>
  <div class="brand">Трансмашхолдинг · НЭВЗ</div>
  <div class="sub">Manufacturing Optimizer</div>
  <div class="bar"><i></i></div>
  <script>
    setTimeout(() => {
      if (window.electronAPI?.splashDone) window.electronAPI.splashDone();
      else location.href = 'index.html';
    }, 2600);
  </script>
</body>
</html>
