<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#020617;color:#fff;font-family:system-ui,sans-serif}
.bg{position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 50% at 20% 40%,rgba(56,189,248,.25),transparent),
  radial-gradient(ellipse 60% 40% at 80% 60%,rgba(129,140,248,.2),transparent),
  #020617}
.grid{position:fixed;inset:0;background-image:
  linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),
  linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);
  background-size:48px 48px;animation:gridMove 20s linear infinite;opacity:.5}
@keyframes gridMove{to{background-position:48px 48px}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring{position:absolute;width:280px;height:280px;border-radius:50%;
  border:1px solid rgba(56,189,248,.25);animation:spin 12s linear infinite}
.ring2{width:340px;height:340px;border-color:rgba(129,140,248,.2);animation-duration:18s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.logos{display:flex;gap:40px;align-items:center;margin-bottom:28px}
.logo{width:110px;height:110px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:26px;letter-spacing:.04em;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.18);
  animation:float 3s ease-in-out infinite;box-shadow:0 0 40px rgba(56,189,248,.15)}
.logo.nevz{animation-delay:.4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.brand{font-size:20px;letter-spacing:.12em;margin-bottom:6px;opacity:0;animation:fadeUp .8s .3s forwards}
.sub{font-size:13px;opacity:0;color:#94a3b8;margin-bottom:36px;animation:fadeUp .8s .5s forwards}
@keyframes fadeUp{to{opacity:1;transform:none}from{opacity:0;transform:translateY(12px)}}
.bar{width:min(280px,70vw);height:3px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);
  transition:width .4s ease}
.pct{margin-top:12px;font-size:12px;color:#64748b;font-variant-numeric:tabular-nums}
.status{margin-top:10px;font-size:12px;color:#94a3b8;min-height:18px;text-align:center;max-width:92vw;padding:0 12px}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap">
  <div class="ring"></div><div class="ring ring2"></div>
  <div class="logos">
    <div class="logo tmh">ТМХ</div>
    <div class="logo nevz">НЭВЗ</div>
  </div>
  <div class="brand">ТРАНСМАШХОЛДИНГ</div>
  <div class="sub">Manufacturing Optimizer · НЭВЗ</div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="pct" id="pct">0%</div>
  <div class="status" id="status">Запуск…</div>
</div>
<script>
(async () => {
  const el = document.getElementById('pct');
  const st = document.getElementById('status');
  const bar = document.getElementById('barFill');
  const MIN_MS = 5500;
  const t0 = Date.now();

  const setUi = (pct, text) => {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    if (el) el.textContent = Math.floor(p) + '%';
    if (bar) bar.style.width = p + '%';
    if (st && text) st.textContent = text;
  };

  setUi(2, 'Запуск…');

  // подписка СРАЗУ — до wait
  const unsub = window.electronAPI?.bootstrap?.onProgress?.((data) => {
    const pct = data.pct ?? 5;
    let line = data.message || 'Загрузка…';
    if (data.operations != null && data.stage && !String(data.stage).endsWith('done') && data.stage !== 'done') {
      line = `${data.message || 'Загрузка'} — уже: ${data.operations} оп., ${data.brigades || 0} бригад, ${data.workers || 0} сотр.`;
    }
    setUi(pct, line);
  });

  try {
    if (window.electronAPI?.bootstrap?.wait) {
      await window.electronAPI.bootstrap.wait();
    } else {
      await new Promise((r) => setTimeout(r, 3000));
    }
  } catch (_) {
    setUi(100, 'Ошибка загрузки');
  }

  if (typeof unsub === 'function') unsub();

  const left = MIN_MS - (Date.now() - t0);
  if (left > 0) await new Promise((r) => setTimeout(r, left));

  const c = await window.electronAPI?.bootstrap?.get?.();
  if (c?.ready) {
    setUi(
      100,
      `Загружено: ${c.operations?.length || 0} операций, ${c.brigades?.length || 0} бригад, ${c.workers?.length || 0} сотрудников`
    );
  } else {
    setUi(100, 'Готово');
  }

  await new Promise((r) => setTimeout(r, 700));
  if (window.electronAPI?.splashDone) window.electronAPI.splashDone();
  else location.href = 'index.html';
})();
</script>
</body>
</html>
